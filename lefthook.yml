# Lefthook git hooks — https://lefthook.dev/configuration/
# Hooks are installed by the "prepare" script (pnpm install runs it).

pre-commit:
  parallel: true
  jobs:
    # Lint + format staged files with Biome, then re-stage the fixes.
    - name: biome
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: test
      run: pnpm test
